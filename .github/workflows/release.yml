name: Release

# Tag-driven releases: pushing a `v*` tag (e.g. v0.1.0, matching
# build/config.yml `info.version`) builds the app natively on all three
# desktop OSes and publishes the binaries to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cash-count-app-linux-amd64
          - os: windows-latest
            asset: cash-count-app-windows-amd64.exe
          - os: macos-latest
            asset: cash-count-app-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build
        run: wails3 build

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: wails3 task darwin:package

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp bin/cash-count-app.exe "dist/${{ matrix.asset }}"
          else
            cp bin/cash-count-app "dist/${{ matrix.asset }}"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "bin/cash-count-app.app" dist/cash-count-app-macos-arm64.app.zip
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
