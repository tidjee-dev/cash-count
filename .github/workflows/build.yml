name: Build

# Linux smoke build: proves the desktop app compiles. The full 3-OS matrix
# only runs on version tags (see release.yml) to save macOS runner minutes.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build
        run: wails3 build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cash-count-app-linux-amd64
          path: bin/cash-count-app
          retention-days: 7
